name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backend-cd.yaml'
      - 'starter/backend/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster
  PYTHON_VERSION: '3.10'

jobs:
  lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore pipenv dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pipenv
            ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run linter
        run: pipenv run lint

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore pipenv dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pipenv
            ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install

      - name: Run tests
        run: pipenv run test

  build:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image tagged with commit SHA
        id: image
        working-directory: starter/backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/backend:$GITHUB_SHA"
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy backend to Amazon EKS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Update manifest to the SHA-tagged image
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("starter/backend/k8s/deployment.yaml")
          contents = manifest.read_text()
          if "image: backend" not in contents:
              raise SystemExit("Expected image: backend in the backend deployment manifest")
          manifest.write_text(contents.replace("image: backend", f"image: {os.environ['IMAGE_URI']}"))
          PY

      - name: Apply backend Kubernetes manifests
        run: kubectl apply -k starter/backend/k8s

      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s || true
          echo "----- Logging - kubectl get all -----"
          kubectl get all
          echo "----- Logging - kubectl describe deploy backend -----"
          kubectl describe deploy backend

      - name: Verify Backend ECR image
        run: |
          echo "----- Logging - Backend ECR Image Details -----"
          AWS_PAGER="" aws ecr describe-images --repository-name backend --region "$AWS_REGION"
          echo "----- Verifying image tag $GITHUB_SHA -----"
          AWS_PAGER="" aws ecr describe-images --repository-name backend --image-ids imageTag="$GITHUB_SHA" --region "$AWS_REGION"

      - name: Display and verify Backend API URL
        run: |
          BACKEND_HOST=""
          for attempt in {1..60}; do
            BACKEND_HOST="$(kubectl get service backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [ -n "$BACKEND_HOST" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$BACKEND_HOST" ]; then
            echo "::error::Backend LoadBalancer hostname was not assigned within 10 minutes."
            exit 1
          fi
          BACKEND_URL="http://$BACKEND_HOST/movies"
          echo "Backend API URL: $BACKEND_URL"
          echo "### Backend application verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend API URL: [$BACKEND_URL]($BACKEND_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          curl --fail --show-error --retry 12 --retry-delay 10 --retry-connrefused "$BACKEND_URL" | tee /tmp/backend-movies.json
          cat /tmp/backend-movies.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
