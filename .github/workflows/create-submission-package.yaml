name: Create Submission Package

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*.yaml'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Prepare submission folders
        run: mkdir -p submission/evidence

      - name: Capture successful GitHub Actions pages
        shell: bash
        run: |
          mkdir -p /tmp/ci-screenshots
          cd /tmp/ci-screenshots
          npm init -y >/dev/null
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          cat > capture.cjs <<'EOF'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
            const pages = [
              ["backend-ci-success.png", "https://github.com/sagarkiranathinarapu-png/movie-picture-pipeline/actions/runs/44180198348"],
              ["frontend-ci-success.png", "https://github.com/sagarkiranathinarapu-png/movie-picture-pipeline/actions/runs/44180204917"]
            ];
            for (const [file, url] of pages) {
              const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
              const response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 120000 });
              if (!response || !response.ok()) {
                throw new Error(`Unable to load ${url}: HTTP ${response && response.status()}`);
              }
              await page.waitForTimeout(8000);
              await page.screenshot({
                path: `${process.env.GITHUB_WORKSPACE}/submission/evidence/${file}`,
                fullPage: true
              });
              await page.close();
            }
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
          node capture.cjs

      - name: Create submission README and source ZIP
        shell: bash
        run: |
          cat > submission/SUBMISSION_README.md <<'EOF'
          # Movie Picture Pipeline — Submission Package

          This package contains the project source from the repository's `main` branch and screenshots of the successful GitHub Actions runs.

          ## CI evidence

          - Backend Continuous Integration: all jobs passed (tests, lint, Docker build).
            https://github.com/sagarkiranathinarapu-png/movie-picture-pipeline/actions/runs/44180198348
          - Frontend Continuous Integration: all jobs passed (tests, lint, Docker build).
            https://github.com/sagarkiranathinarapu-png/movie-picture-pipeline/actions/runs/44180204917

          Screenshots are in `evidence/`. They were captured from the public GitHub Actions run pages by this workflow.

          ## CI/CD deliverables

          Four separate GitHub Actions workflows are included:
          - `.github/workflows/frontend-ci.yaml`: frontend pull-request CI, manual CI, lint, tests and Docker build
          - `.github/workflows/backend-ci.yaml`: backend pull-request CI, manual CI, lint, tests and Docker build
          - `.github/workflows/frontend-cd.yaml`: frontend CD, SHA-tagged ECR image build/push and EKS deployment
          - `.github/workflows/backend-cd.yaml`: backend CD, SHA-tagged ECR image build/push and EKS deployment

          ## Required GitHub configuration before running CD

          Add these repository **Actions secrets** under Settings → Secrets and variables → Actions:
          - `AWS_ACCESS_KEY_ID`: access key for the Terraform-created `github-action-user`
          - `AWS_SECRET_ACCESS_KEY`: matching secret access key

          The workflows target AWS region `us-east-1`, EKS cluster `cluster`, and ECR repositories `backend` and `frontend`. Provision the AWS resources first using the Terraform instructions in the project README.

          Run **Backend Continuous Deployment** first from Actions. After the backend service has a LoadBalancer hostname, copy the `Backend API URL` shown in the deploy job and add a repository **Actions variable** named `MOVIE_API_URL` with that full URL (for example, `http://<backend-load-balancer-hostname>`). Then run **Frontend Continuous Deployment**.

          CD workflows can also run automatically when their respective application directory changes on `main`. Each workflow only deploys after its lint and test jobs pass. The deployment job updates the Kubernetes deployment to use the image tagged with the triggering commit SHA and waits for the rollout.

          **Deployment status:** CD workflow definitions are included, but a successful live EKS deployment must be confirmed in the target AWS account after the two repository secrets, infrastructure, and `MOVIE_API_URL` variable are configured. No AWS credentials are stored in this ZIP.

          ## Packaging notes

          - Generated Terraform state (`setup/terraform/terraform.tfstate`) and local caches/build outputs are excluded.
          - Terraform configuration, Kubernetes manifests, application source, workflows, dependency lockfiles, and project documentation are included.
          EOF

          python - <<'PY'
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          output = root / "submission" / "Movie-Picture-Pipeline-Submission.zip"
          excluded_exact = {
              "setup/terraform/terraform.tfstate",
          }
          excluded_parts = {
              ".git", ".terraform", "node_modules", "__pycache__", ".pytest_cache",
              ".venv", "venv", "build", "dist", "coverage",
          }
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=8) as archive:
              for item in filter(None, tracked):
                  path = Path(item)
                  if item in excluded_exact or any(part in excluded_parts for part in path.parts):
                      continue
                  if path.name in {".env", ".env.local", ".env.production"}:
                      continue
                  file_path = root / path
                  if file_path.is_file():
                      archive.write(file_path, Path("movie-picture-pipeline") / path)
              archive.write(root / "submission" / "SUBMISSION_README.md",
                            Path("movie-picture-pipeline") / "SUBMISSION_README.md")
              for evidence in sorted((root / "submission" / "evidence").glob("*.png")):
                  archive.write(evidence, Path("movie-picture-pipeline") / "submission" / "evidence" / evidence.name)
          with zipfile.ZipFile(output) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f"Corrupt ZIP member: {bad}")
              print(f"Created {output} ({output.stat().st_size} bytes, {len(archive.namelist())} files)")
          PY

      - name: Upload submission ZIP
        uses: actions/upload-artifact@v4
        with:
          name: movie-picture-pipeline-submission
          path: submission/Movie-Picture-Pipeline-Submission.zip
          if-no-files-found: error
          retention-days: 30
