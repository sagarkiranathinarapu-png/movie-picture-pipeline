name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/frontend-cd.yaml'
      - 'starter/frontend/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster
  NODE_VERSION: '18'

jobs:
  lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false

  build:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'

      - name: Resolve backend API URL from EKS service
        id: backend-url
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          BACKEND_HOST=""
          for attempt in {1..60}; do
            BACKEND_HOST="$(kubectl get service backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [ -n "$BACKEND_HOST" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$BACKEND_HOST" ]; then
            echo "::error::Backend LoadBalancer hostname not found. Run Backend Continuous Deployment first."
            exit 1
          fi
          echo "Backend API URL: http://$BACKEND_HOST/movies"
          echo "url=http://$BACKEND_HOST" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image tagged with commit SHA
        id: image
        working-directory: starter/frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          MOVIE_API_URL: ${{ steps.backend-url.outputs.url }}
        run: |
          IMAGE_URI="$REGISTRY/frontend:$GITHUB_SHA"
          docker build --build-arg "REACT_APP_MOVIE_API_URL=$MOVIE_API_URL" --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy frontend to Amazon EKS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Update manifest to the SHA-tagged image
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("starter/frontend/k8s/deployment.yaml")
          contents = manifest.read_text()
          if "image: frontend" not in contents:
              raise SystemExit("Expected image: frontend in the frontend deployment manifest")
          manifest.write_text(contents.replace("image: frontend", f"image: {os.environ['IMAGE_URI']}"))
          PY

      - name: Apply frontend Kubernetes manifests
        run: kubectl apply -k starter/frontend/k8s

      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=180s || true
          echo "----- Logging - kubectl get all -----"
          kubectl get all
          echo "----- Logging - kubectl describe deploy frontend -----"
          kubectl describe deploy frontend

      - name: Verify Frontend ECR image
        run: |
          echo "----- Logging - Frontend ECR Image Details -----"
          AWS_PAGER="" aws ecr describe-images --repository-name frontend --region "$AWS_REGION"
          echo "----- Verifying image tag $GITHUB_SHA -----"
          AWS_PAGER="" aws ecr describe-images --repository-name frontend --image-ids imageTag="$GITHUB_SHA" --region "$AWS_REGION"

      - name: Display and verify Frontend Application URL
        run: |
          FRONTEND_HOST=""
          for attempt in {1..60}; do
            FRONTEND_HOST="$(kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [ -n "$FRONTEND_HOST" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$FRONTEND_HOST" ]; then
            echo "::error::Frontend LoadBalancer hostname was not assigned within 10 minutes."
            exit 1
          fi
          FRONTEND_URL="http://$FRONTEND_HOST/"
          echo "Frontend Application URL: $FRONTEND_URL"
          echo "### Frontend application verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend Application URL: [$FRONTEND_URL]($FRONTEND_URL)" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --show-error --retry 12 --retry-delay 10 --retry-connrefused "$FRONTEND_URL"
