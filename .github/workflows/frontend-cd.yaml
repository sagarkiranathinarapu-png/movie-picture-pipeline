name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster
  NODE_VERSION: '18'

jobs:
  lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint -- --fix

  test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false

  build:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image tagged with commit SHA
        id: image
        working-directory: starter/frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          MOVIE_API_URL: ${{ vars.MOVIE_API_URL }}
        run: |
          if [ -z "$MOVIE_API_URL" ]; then
            echo "::error::MOVIE_API_URL is not set. Deploy the backend CD workflow first so it can publish the backend LoadBalancer URL."
            exit 1
          fi
          IMAGE_URI="$REGISTRY/frontend:$GITHUB_SHA"
          docker build --build-arg "REACT_APP_MOVIE_API_URL=$MOVIE_API_URL" --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy frontend to Amazon EKS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Update manifest to the SHA-tagged image
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("starter/frontend/k8s/deployment.yaml")
          contents = manifest.read_text()
          if "image: frontend" not in contents:
              raise SystemExit("Expected image: frontend in the frontend deployment manifest")
          manifest.write_text(contents.replace("image: frontend", f"image: {os.environ['IMAGE_URI']}"))
          PY

      - name: Apply frontend Kubernetes manifests
        run: kubectl apply -k starter/frontend/k8s

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend --timeout=300s
